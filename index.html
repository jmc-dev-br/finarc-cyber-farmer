<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinArc: Cyber Farmer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0d0f17; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #game-container { position: relative; width: 1000px; height: 600px; background: #121526; border: 3px solid #00f0ff; border-radius: 12px; box-shadow: 0 0 30px rgba(0,240,255,0.2); overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* UI Screens */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(13,15,23,0.92); z-index: 10; padding: 20px; }
        .hidden { display: none !important; }
        
        h1 { font-size: 2.8rem; color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #a0aec0; margin-bottom: 20px; text-align: center; max-width: 600px; }
        
        .btn { background: linear-gradient(135deg, #00f0ff, #7000ff); color: #fff; border: none; padding: 12px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 8px; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px #00f0ff; }
        .btn-secondary { background: #2d3748; color: #cbd5e0; }
        .btn-secondary:hover { background: #4a5568; box-shadow: none; }
        
        /* Customization Slot */
        .card { background: #1a1d36; border: 1px solid #00f0ff44; padding: 20px; border-radius: 8px; width: 360px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: #00f0ff; margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 8px; background: #0d0f17; border: 1px solid #2d3748; color: #fff; border-radius: 4px; font-size: 1rem; }
        
        /* In-game HUD */
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        .hud-card { background: rgba(18,21,38,0.85); border: 1px solid #00f0ff44; padding: 10px 16px; border-radius: 8px; pointer-events: auto; }
        .hud-title { font-size: 0.75rem; color: #a0aec0; text-transform: uppercase; }
        .hud-val { font-size: 1.3rem; font-weight: bold; color: #00f0ff; }
        
        /* Dialogue Box */
        #dialogue-box { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; background: rgba(18,21,38,0.95); border: 2px solid #00f0ff; border-radius: 8px; padding: 15px 20px; z-index: 6; display: flex; flex-direction: column; gap: 8px; }
        #dialogue-name { color: #7000ff; font-weight: bold; font-size: 1.1rem; }
        #dialogue-text { color: #e2e8f0; font-size: 0.95rem; line-height: 1.4; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <!-- HUD In-Game -->
    <div id="hud" class="hidden">
        <div class="hud-card">
            <div class="hud-title">Carteira Circle (USDC)</div>
            <div id="hud-usdc" class="hud-val">$100.00</div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Educação Financeira</div>
            <div id="hud-score" class="hud-val" style="color: #7000ff;">Nível 1</div>
        </div>
    </div>

    <!-- Caixa de Diálogo -->
    <div id="dialogue-box" class="hidden">
        <div id="dialogue-name">NPC</div>
        <div id="dialogue-text">Olá! Bem-vindo ao FinArc.</div>
        <button class="btn" style="align-self: flex-end; padding: 6px 14px; font-size: 0.85rem;" onclick="closeDialogue()">Continuar</button>
    </div>

    <!-- Menu Principal -->
    <div id="menu-screen" class="overlay">
        <h1>FinArc: Cyber Farmer</h1>
        <p>Aprenda educação financeira e gestão de USDC enquanto constrói sua fazenda sustentável na rede Arc.</p>
        <button class="btn" onclick="showScreen('char-screen')">Novo Jogo</button>
        <button class="btn btn-secondary" onclick="showScreen('settings-screen')">Configurações</button>
    </div>

    <!-- Configurações -->
    <div id="settings-screen" class="overlay hidden">
        <h1>Configurações</h1>
        <div class="card">
            <div class="form-group">
                <label>Efeitos Sonoros</label>
                <select id="audio-opt"><option>Ativado</option><option>Desativado</option></select>
            </div>
            <div class="form-group">
                <label>Velocidade do Texto</label>
                <select><option>Rápido</option><option>Normal</option></select>
            </div>
        </div>
        <button class="btn" onclick="showScreen('menu-screen')">Voltar</button>
    </div>

    <!-- Criação de Personagem -->
    <div id="char-screen" class="overlay hidden">
        <h1>Criar Personagem</h1>
        <div class="card">
            <div class="form-group">
                <label>Nome do Agricultor</label>
                <input type="text" id="char-name" value="Alex" maxlength="12">
            </div>
            <div class="form-group">
                <label>Cor da Roupa</label>
                <select id="char-color">
                    <option value="#00f0ff">Azul Cyber</option>
                    <option value="#7000ff">Roxo Neon</option>
                    <option value="#00ff88">Verde Bio</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ferramenta Inicial</label>
                <select id="char-tool">
                    <option value="hoe">Enxada de Bio-Solo</option>
                    <option value="can">Regador Inteligente</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="startGame()">Iniciar Jornada</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Estado do Jogo
    let gameState = 'MENU';
    let player = { x: 500, y: 300, size: 24, speed: 4, name: 'Alex', color: '#00f0ff', tool: 'hoe', usdc: 100, score: 1 };
    let keys = {};
    let npcs = [
        { x: 300, y: 200, name: 'Kai (Consultor Circle)', color: '#00ff88', dialog: 'Lembre-se: Antes de gastar seu USDC com melhorias luxuosas, crie uma reserva de emergência no protocolo Arc!' },
        { x: 700, y: 400, name: 'Elena (Especialista DeFi)', color: '#7000ff', dialog: 'Investir o USDC parado na fazenda em staking na rede Arc gera rendimentos passivos diários!' }
    ];

    function showScreen(screenId) {
        document.querySelectorAll('.overlay').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function startGame() {
        player.name = document.getElementById('char-name').value || 'Alex';
        player.color = document.getElementById('char-color').value;
        player.tool = document.getElementById('char-tool').value;

        showScreen('');
        document.getElementById('hud').classList.remove('hidden');
        gameState = 'PLAYING';
        gameLoop();
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function update() {
        if (gameState !== 'PLAYING') return;

        if (keys['w'] || keys['arrowup']) player.y -= player.speed;
        if (keys['s'] || keys['arrowdown']) player.y += player.speed;
        if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
        if (keys['d'] || keys['arrowright']) player.x += player.speed;

        // Limites da tela
        player.x = Math.max(20, Math.min(980, player.x));
        player.y = Math.max(20, Math.min(580, player.y));

        // Interação com NPCs (Pressionar E)
        npcs.forEach(npc => {
            let dist = Math.hypot(player.x - npc.x, player.y - npc.y);
            if (dist < 40 && keys['e']) {
                openDialogue(npc.name, npc.dialog);
            }
        });
    }

    function openDialogue(name, text) {
        document.getElementById('dialogue-name').innerText = name;
        document.getElementById('dialogue-text').innerText = text;
        document.getElementById('dialogue-box').classList.remove('hidden');
        gameState = 'DIALOGUE';
    }

    function closeDialogue() {
        document.getElementById('dialogue-box').classList.add('hidden');
        gameState = 'PLAYING';
    }

    function draw() {
        // Fundo (Grama / Terra Cyber)
        ctx.fillStyle = '#121526';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenhar Grid da Fazenda
        ctx.strokeStyle = '#1d223a';
        for(let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Desenhar NPCs
        npcs.forEach(npc => {
            ctx.fillStyle = npc.color;
            ctx.beginPath();
            ctx.arc(npc.x, npc.y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = '12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(npc.name.split(' ')[0], npc.x, npc.y - 22);
            ctx.fillText('[E] Falar', npc.x, npc.y + 30);
        });

        // Desenhar Jogador
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Nome do Jogador
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 13px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(player.name, player.x, player.y - 20);
    }

    function gameLoop() {
        update();
        draw();
        if (gameState === 'PLAYING' || gameState === 'DIALOGUE') {
            requestAnimationFrame(gameLoop);
        }
    }
</script>
</body>
</html>
